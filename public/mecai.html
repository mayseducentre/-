/* === Render helpers & typewriter === */
function messageTypingSpeed(text){
  const len = (text||'').length;
  if(len < 30) return 14;
  if(len < 80) return 20;
  if(len < 200) return 28;
  return 34;
}

function typeWriterEffect(text, element, i=0, speed=20){
  if(i === 0) element.textContent = '';
  if(i < text.length){
    element.textContent += text.charAt(i);
    const jitter = Math.round(Math.random()*8 - 4);
    setTimeout(()=> typeWriterEffect(text, element, i+1, Math.max(6, speed + jitter)), speed + jitter);
  }
}

/* create message node; animate true for new AI replies */
function createMessageNode(msg, animate=false){
  const row = document.createElement('div');
  row.className = 'msg-row ' + (msg.role === 'ai' ? 'ai' : 'user');

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + (msg.role === 'ai' ? 'ai' : 'user');
  avatar.setAttribute('aria-hidden','true');
  avatar.innerText = msg.role === 'ai' ? 'M' : 'Y';

  const bubble = document.createElement('article');
  bubble.className = 'bubble ' + (msg.role === 'ai' ? 'ai' : 'user');

  const content = document.createElement('div');
  content.style.whiteSpace = 'pre-wrap';

  if(msg.role === 'ai' && animate){
    // typewriter with speed based on length
    typeWriterEffect(msg.text || '', content, 0, messageTypingSpeed(msg.text || ''));
  } else {
    content.textContent = msg.text || '';
  }
  bubble.appendChild(content);

  if(msg.meta && msg.meta.image){
    const img = document.createElement('img');
    img.src = msg.meta.image;
    img.alt = msg.meta.alt || 'Image';
    img.className = 'msg-img';
    bubble.appendChild(img);
  }

  const time = document.createElement('div');
  time.className = 'time';
  try{ time.innerText = new Date(msg.ts || nowISO()).toLocaleTimeString(); } catch(e){ time.innerText = ''; }
  bubble.appendChild(time);

  if(msg.role === 'ai'){ row.appendChild(avatar); row.appendChild(bubble); }
  else { row.appendChild(bubble); row.appendChild(avatar); }

  return row;
}

function appendMessage(role, text, meta = {}, save=true, animate=false){
  const msg = { id: uid('m'), role, text: text || '', meta: meta || {}, ts: nowISO() };
  const node = createMessageNode(msg, animate);
  chatScroll.appendChild(node);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  if(save){
    CONV.push(msg);
    saveConv(CONV);
  }
}

/* === Storage helpers === */
function loadConv(){
  try{
    const raw = localStorage.getItem(STORAGE.CONV);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(e){ console.warn('loadConv error', e); return []; }
}
function saveConv(conv){
  try{ localStorage.setItem(STORAGE.CONV, JSON.stringify(conv)); } catch(e){ console.warn('saveConv error', e); }
}
function loadSession(){
  try{
    const raw = localStorage.getItem(STORAGE.SESSION);
    if(!raw) return { lastTopic: null, games: {} };
    return JSON.parse(raw) || { lastTopic: null, games: {} };
  }catch(e){ return { lastTopic:null, games:{} }; }
}
function saveSession(){
  try{ localStorage.setItem(STORAGE.SESSION, JSON.stringify(SESSION)); } catch(e){ console.warn('saveSession error', e); }
}

/* === KB lookup: improved substring + prefix stripping + longest-match === */
function findKBEntryForQuery(text){
  if(!text) return null;
  let q = normalize(text);
  if(!q) return null;

  // remove prefixes like "what is"
  q = q.replace(/^(what is|who is|tell me about|explain|define|what's|what are|what's the)\s+/i, '').trim();
  if(!q) return null;

  let best = null;
  for(const entry of KB){
    const key = normalize(entry.question);
    if(!key) continue;
    if(key.length < 3) continue; // 🚫 skip too short keys

    // match either whole word or contained phrase
    const regex = new RegExp("\\b" + key.replace(/[.*+?^${}()|[\]\\]/g,"\\$&") + "\\b");
    if(regex.test(q) || q.includes(key)){
      if(!best) best = entry;
      else if(key.length > normalize(best.question).length) best = entry;
    }
  }
  return best;
}



/* === Command detection (do NOT treat 'what is' as math) === */
function isCommand(text){
  if(!text) return null;
  const t = normalize(text);
  // math/sovle: explicit 'solve' or expressions with numbers/operators
  if(t.startsWith('solve ') || t.startsWith('calculate ') || /-?\d+\s*[+\-*/x×÷]\s*-?\d+/.test(t)) return 'solve';
  if(t.startsWith('play number') || t === 'play number game') return 'play-number';
  if(t.startsWith('play riddle') || t === 'play riddle game') return 'play-riddle';
  if(t.startsWith('draw ') || t.startsWith('ascii ')) return 'draw';
  if(t.startsWith('homework') || t.startsWith('hw ') || t.startsWith('help with')) return 'homework';
  if(t.startsWith('guess ') || (/^\s*-?\d+\s*$/.test(t) && SESSION.games && SESSION.games.number && SESSION.games.number.active)) return 'guess';
  if(t === 'give up') return 'give-up';
  return null;
}

/* === Games & features === */
/* Number guessing game */
function startNumberGame(min=1,max=20){
  const secret = Math.floor(Math.random()*(max-min+1))+min;
  SESSION.games.number = { active:true, secret, min, max, attempts:0 };
  saveSession();
  appendMessage('ai', `I picked a number between ${min} and ${max}. Try to guess it! (type a number or 'guess X')`, {}, true, true);
}
function handleNumberGuess(input){
  const g = SESSION.games.number;
  if(!g || !g.active){ appendMessage('ai', "No active number game. Type 'play number game' to start.", {}, true, true); return; }
  const num = parseInt(input,10);
  if(Number.isNaN(num)){ appendMessage('ai', "Please send a number (e.g., 7).", {}, true, true); return; }
  g.attempts = (g.attempts||0) + 1;
  saveSession();
  if(num === g.secret){
    appendMessage('ai', `🎉 Correct! The number was ${g.secret}. You guessed it in ${g.attempts} attempts. Want to play again? Type 'play number game'.`, {}, true, true);
    SESSION.games.number.active = false; saveSession();
  } else if(num < g.secret){
    appendMessage('ai', 'Too low — try a higher number.', {}, true, true);
  } else {
    appendMessage('ai', 'Too high — try a lower number.', {}, true, true);
  }
}

/* Riddle game */
const RIDDLES = [
  {q:"I have keys but open no locks. What am I?", a:"A piano or a keyboard."},
  {q:"What has hands but cannot clap?", a:"A clock."},
  {q:"What gets wetter as it dries?", a:"A towel."}
];
function startRiddle(){
  const r = pick(RIDDLES);
  SESSION.games.riddle = { active:true, current:r };
  saveSession();
  appendMessage('ai', `Riddle: ${r.q} (Type your answer)`, {}, true, true);
}
function checkRiddleAnswer(ans){
  const s = SESSION.games.riddle;
  if(!s || !s.active){ appendMessage('ai', "No active riddle. Type 'play riddle game' to start.", {}, true, true); return; }
  const correct = normalize(s.current.a);
  if(normalize(ans).includes(correct) || correct.includes(normalize(ans))){
    appendMessage('ai', `Correct! ✅ Answer: ${s.current.a}`, {}, true, true);
    SESSION.games.riddle.active = false; saveSession();
  } else {
    appendMessage('ai', "Not quite — try again or type 'give up' to see the answer.", {}, true, true);
  }
}

/* ASCII draw */
function handleDraw(command){
  const t = normalize(command).replace(':',' ');
  const parts = t.split(/\s+/);
  const target = parts[1] || parts[2] || '';
  if(!target){ appendMessage('ai', "Tell me what to draw, e.g. 'draw cat' or 'draw tree'.", {}, true, true); return; }
  const art = ASCII[target] || null;
  if(art){ appendMessage('ai', art, {}, true, true); }
  else { appendMessage('ai', `I don't have ASCII art for "${target}" yet. Try: cat, tree, house, rocket.`, {}, true, true); }
}

/* Simple math solver */
function solveExpressionRaw(expr){
  const s = expr.replace(/×/g,'*').replace(/x\b/gi,'*').replace(/÷/g,'/');
  const m = s.match(/(-?\d+)\s*([+\-*/])\s*(-?\d+)/);
  if(!m) return null;
  const a = parseInt(m[1],10);
  const op = m[2];
  const b = parseInt(m[3],10);
  let result, steps = [];
  if(op === '+'){ result = a + b; steps.push(`${a} + ${b} = ${result} (added)`); }
  else if(op === '-'){ result = a - b; steps.push(`${a} - ${b} = ${result} (subtracted)`); }
  else if(op === '*'){ result = a * b; steps.push(`${a} × ${b} = ${result} (multiplied)`); }
  else if(op === '/'){
    if(b === 0){ steps.push('Division by zero is undefined.'); result = null; }
    else { const q = Math.floor(a/b); const r = a % b; result = a / b; steps.push(`${a} ÷ ${b} = ${q} remainder ${r}.`); }
  }
  return {a,op,b,result,steps};
}
function handleSolve(command){
  let expr = command;
  const t = normalize(command);
  if(t.startsWith('solve ')) expr = command.slice(6).trim();
  else if(t.startsWith('calculate ')) expr = command.slice(10).trim();
  else {
    const found = expr.match(/-?\d+\s*[+\-*/x×÷]\s*-?\d+/);
    if(found) expr = found[0];
  }
  const res = solveExpressionRaw(expr);
  if(!res){ appendMessage('ai', "I couldn't parse that expression. Try 'solve 12 + 5' or 'solve 7*8'.", {}, true, true); return; }
  appendMessage('ai', `Let's solve: ${res.a} ${res.op} ${res.b}\n\nStep-by-step:\n- ${res.steps.join('\n- ')}\n\nAnswer: ${res.result}`, {}, true, true);
}

/* Homework helper */
function handleHomework(command){
  const lower = normalize(command);
  let question = command;
  if(lower.startsWith('homework')) question = command.slice(8).trim();
  else if(lower.startsWith('hw ')) question = command.slice(3).trim();
  else if(lower.startsWith('help with')) question = command.slice(9).trim();

  if(!question){ appendMessage('ai', "What homework question would you like help with? e.g. 'homework what is binary'", {}, true, true); return; }

  if(/-?\d+\s*[+\-*/x×÷]\s*-?\d+/.test(question) || /\bsolve\b/i.test(question)){
    appendMessage('ai', `Homework: I'll help solve "${question}" step-by-step.`, {}, true, true);
    handleSolve(question);
    appendMessage('ai', "Now try a similar one and tell me your answer — I'll check it.", {}, true, true);
    return;
  }
  const kb = findKBEntryForQuery(question);
  if(kb){
    appendMessage('ai', `Homework help — ${kb.answer}\n\nDo you want an example or a step-by-step?`, {}, true, true);
    return;
  }
  appendMessage('ai', `Homework helper — rephrasing: "${question}".\nExplanation: I'll explain simply and give an example. Tell me which part to start with.`, {}, true, true);
}

/* === Image handling === */
attachBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if(!f) return;
  if(!f.type.startsWith('image/')) { alert('Only image files are supported for preview.'); return; }
  const reader = new FileReader();
  reader.onload = ev => { previewImg.src = ev.target.result; previewImg.style.display = 'block'; };
  reader.readAsDataURL(f);
});

/* === Main send handler === */
function handleSend(){
  const raw = textInput.value || '';
  const text = raw.trim();
  const hasPreview = previewImg && previewImg.style.display !== 'none' && previewImg.src;
  if(!text && !hasPreview) return;

  // user text
  if(text) appendMessage('user', text, {}, true, false);

  // image
  let imageSent = false;
  if(hasPreview){
    const data = previewImg.src;
    appendMessage('user', '[image]', { image: data, alt: 'User uploaded image' }, true, false);
    imageSent = true;
    // hide preview & clear file input
    previewImg.src = '';
    previewImg.style.display = 'none';
    try{ fileInput.value = ''; } catch(e){}
  }

  // update session lastTopic if text matches KB
  if(text){
    const maybeTopic = findKBEntryForQuery(text);
    if(maybeTopic){ SESSION.lastTopic = maybeTopic.question; saveSession(); }
  }

  textInput.value = '';
  textInput.focus();

  // respond after a short delay
  setTimeout(() => {
    if(text){
      const cmd = isCommand(text);
      if(cmd === 'play-number'){ startNumberGame(1,20); return; }
      if(cmd === 'guess'){ const rest = text.replace(/guess\s+/i,'').trim(); handleNumberGuess(rest); return; }
      if(cmd === 'play-riddle'){ startRiddle(); return; }
      if(cmd === 'draw'){ handleDraw(text); return; }
      if(cmd === 'solve'){ handleSolve(text); return; }
      if(cmd === 'homework'){ handleHomework(text); return; }
      if(cmd === 'give-up'){ if(SESSION.games && SESSION.games.riddle && SESSION.games.riddle.active){ appendMessage('ai', `Answer: ${SESSION.games.riddle.current.a}`, {}, true, true); SESSION.games.riddle.active=false; saveSession(); } return; }
      if(SESSION.games && SESSION.games.riddle && SESSION.games.riddle.active){
        checkRiddleAnswer(text); return;
      }
      if(SESSION.games && SESSION.games.number && SESSION.games.number.active && /^\s*-?\d+\s*$/.test(text)){
        handleNumberGuess(text.trim()); return;
      }
      // KB match
      const kb = findKBEntryForQuery(text);
      if(kb){ appendMessage('ai', kb.answer + pick(["", " 😊", " — hope that helps!"]), {}, true, true); }
      else { appendMessage('ai', pick(FALLBACKS), {}, true, true); }
    } else {
      // no text but image sent
      if(imageSent){ appendMessage('ai', pick(IMAGE_REPLIES), {}, true, true); }
    }
    // If both text and image were present, also reply to image after short delay
    if(imageSent && text){
      setTimeout(()=> appendMessage('ai', pick(IMAGE_REPLIES), {}, true, true), 600);
    }
  }, 420);
}

/* === KB match function (already defined above but exported for reuse) === */
/* (see findKBEntryForQuery) */

/* === Export & Reset === */
exportBtn.addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(CONV, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'mecai-conversation-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  a.remove();
});

resetBtn.addEventListener('click', () => {
  if(!confirm('Clear conversation and reset session?')) return;
  CONV = [];
  SESSION = { lastTopic: null, games: {} };
  saveConv(CONV);
  saveSession();
  chatScroll.innerHTML = '';
  pushWelcome();
});

/* === Render stored conversation on load (no animation) === */
function renderFromStorage(){
  chatScroll.innerHTML = '';
  if(CONV && CONV.length){
    CONV.forEach(m => {
      const node = createMessageNode(m, false);
      chatScroll.appendChild(node);
    });
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }
}
function pushWelcome(){
  if(SESSION && SESSION.lastTopic){
    appendMessage('ai', `Welcome back! Last time we talked about "${SESSION.lastTopic}". Want to continue or try something new?`, {}, true, true);
  } else {
    appendMessage('ai', "Hello 👋 I'm MEC AI. I can help with schoolwork, play games, draw ASCII art, solve math step-by-step, and more. Try: 'play number game', 'draw cat', 'solve 12+5', or 'homework <your question>'.", {}, true, true);
  }
}

/* === Keyboard & events === */
sendBtn.addEventListener('click', handleSend);
textInput.addEventListener('keydown', (e) => { if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); handleSend(); }});

/* === Init === */
renderFromStorage();
if(!CONV || !CONV.length) pushWelcome();

/* === Expose small debug helpers === */
window.MECAI = { CONV, SESSION, saveConv: () => saveConv(CONV), saveSession, findKBEntryForQuery };

/* === End script === */
</script>
